name: deploy-v0.3.2-final

on:
  push:
    branches:
      - master

permissions:
  contents: read
  actions: read

concurrency:
  group: agentshare-v0.3.2-production-final
  cancel-in-progress: false

jobs:
  deploy-and-live-gate:
    if: >-
      github.repository == 'amazing-aaryan/AgentShare' &&
      startsWith(github.event.head_commit.message, 'Merge v0.3.2 production deployment gate')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CANDIDATE_SHA: 4d6957bd2effebf1c1136e1cac60424d88c4eaea
      PACKAGE_SHA256: e48f903186f787a6c1865a8d8e25303c3c89e1c8591851aefe81ca0ca9ee5c09
      PACKAGE_SIZE_BYTES: "156894"
      AGENTSHARE_E2E_RELAY: https://agentshare-relay.carnation-vermicelli.workers.dev
      AGENTSHARE_E2E_HANDOFF: https://agentshare-handoff.carnation-vermicelli.workers.dev
      AGENTSHARE_NO_UPDATE_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact immutable package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
          cache: npm

      - name: Re-run release and deployment checks before any write
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/check-repository-hygiene.mjs
          npm run format:check
          npm run lint
          npm run build
          npm run test:release-tools
          npm run test:coverage
          npm run test:conformance
          npm run test:package
          npm run test:edge-runtime
          npx wrangler deploy --dry-run --config apps/edge-relay/wrangler.jsonc
          npx wrangler deploy --dry-run --config apps/handoff/wrangler.jsonc
          npm audit --audit-level=high

      - name: Check out reviewed release control separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Build reviewed release control
        shell: bash
        run: |
          set -euo pipefail
          cd .release-control
          npm ci
          npm run build

      - name: Verify exact candidate CI, production binding, and immutable package
        env:
          AGENTSHARE_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          AGENTSHARE_PACKAGE_SHA256: ${{ env.PACKAGE_SHA256 }}
          AGENTSHARE_PACKAGE_SIZE: ${{ env.PACKAGE_SIZE_BYTES }}
        run: node .release-control/scripts/check-deployment.mjs preflight

      - name: Require Cloudflare credentials before any Worker write
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::Missing Cloudflare account ID"; exit 1; }

      - name: Record unchanged relay deployment before handoff update
        id: relay_before
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config apps/edge-relay/wrangler.jsonc --json > relay-deployments-before.json
          relay_deployment="$(jq -r '.[-1].id // empty' relay-deployments-before.json)"
          relay_version="$(jq -r '.[-1].versions | map(select(.percentage == 100)) | if length == 1 then .[0].version_id else empty end' relay-deployments-before.json)"
          test -n "${relay_deployment}" || { echo "::error::Unable to resolve current relay deployment"; exit 1; }
          test -n "${relay_version}" || { echo "::error::Unable to resolve current relay version"; exit 1; }
          echo "deployment=${relay_deployment}" >> "${GITHUB_OUTPUT}"
          echo "version=${relay_version}" >> "${GITHUB_OUTPUT}"
          echo "--- unchanged relay deployments ---"
          cat relay-deployments-before.json

      - name: Deploy exact v0.3.2 handoff Worker
        id: handoff
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config apps/handoff/wrangler.jsonc --json > handoff-deployments-before.json
          previous_version="$(jq -r '.[-1].versions | map(select(.percentage == 100)) | if length == 1 then .[0].version_id else empty end' handoff-deployments-before.json)"
          previous_deployment="$(jq -r '.[-1].id // empty' handoff-deployments-before.json)"
          test -n "${previous_version}" || { echo "::error::Unable to resolve pre-deploy handoff version"; exit 1; }
          test -n "${previous_deployment}" || { echo "::error::Unable to resolve pre-deploy handoff deployment"; exit 1; }

          npx wrangler deploy --config apps/handoff/wrangler.jsonc

          npx wrangler deployments list --config apps/handoff/wrangler.jsonc --json > handoff-deployments-after.json
          current_version="$(jq -r '.[-1].versions | map(select(.percentage == 100)) | if length == 1 then .[0].version_id else empty end' handoff-deployments-after.json)"
          current_deployment="$(jq -r '.[-1].id // empty' handoff-deployments-after.json)"
          test -n "${current_version}" || { echo "::error::Unable to resolve post-deploy handoff version"; exit 1; }
          test -n "${current_deployment}" || { echo "::error::Unable to resolve post-deploy handoff deployment"; exit 1; }
          test "${current_version}" != "${previous_version}" || { echo "::error::Handoff version did not change after v0.3.2 deployment"; exit 1; }
          test "${current_deployment}" != "${previous_deployment}" || { echo "::error::Handoff deployment did not change after v0.3.2 deployment"; exit 1; }
          echo "deployment=${current_deployment}" >> "${GITHUB_OUTPUT}"
          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "--- handoff deployments after v0.3.2 deployment ---"
          cat handoff-deployments-after.json

      - name: Verify public handoff, bootstrap pin, and relay routing
        run: node scripts/check-deployment.mjs smoke

      - name: Run disposable public v1 and v2 lifecycles
        run: >-
          npx vitest run packages/cli/src/public-handoff.e2e.test.ts
          packages/cli/src/environment/public-environment.e2e.test.ts
          --reporter=verbose

      - name: Verify relay remained unchanged
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config apps/edge-relay/wrangler.jsonc --json > relay-deployments-after.json
          relay_deployment="$(jq -r '.[-1].id // empty' relay-deployments-after.json)"
          relay_version="$(jq -r '.[-1].versions | map(select(.percentage == 100)) | if length == 1 then .[0].version_id else empty end' relay-deployments-after.json)"
          test "${relay_deployment}" = "${{ steps.relay_before.outputs.deployment }}" || { echo "::error::Relay deployment changed during handoff release"; exit 1; }
          test "${relay_version}" = "${{ steps.relay_before.outputs.version }}" || { echo "::error::Relay version changed during handoff release"; exit 1; }

      - name: Re-verify immutable prerelease after live tests
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh release view v0.3.2 --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isImmutable,isPrerelease,targetCommitish,assets)"
          test "$(jq -r '.tagName' <<<"${metadata}")" = "v0.3.2"
          test "$(jq -r '.isDraft' <<<"${metadata}")" = "false"
          test "$(jq -r '.isImmutable' <<<"${metadata}")" = "true"
          test "$(jq -r '.isPrerelease' <<<"${metadata}")" = "true"
          test "$(jq -r '.targetCommitish' <<<"${metadata}")" = "${CANDIDATE_SHA}"
          test "$(jq -r '.assets[] | select(.name == "agentshare-0.3.2.tgz") | .size' <<<"${metadata}")" = "${PACKAGE_SIZE_BYTES}"
          test "$(jq -r '.assets[] | select(.name == "agentshare-0.3.2.tgz") | .digest' <<<"${metadata}")" = "sha256:${PACKAGE_SHA256}"
          {
            echo "### v0.3.2 production prerequisite gate passed"
            echo "- Exact candidate: \`${CANDIDATE_SHA}\`"
            echo "- Immutable package SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Immutable package bytes: \`${PACKAGE_SIZE_BYTES}\`"
            echo "- Relay deployment: \`${{ steps.relay_before.outputs.deployment }}\` (unchanged)"
            echo "- Relay version: \`${{ steps.relay_before.outputs.version }}\` (unchanged)"
            echo "- Handoff deployment: \`${{ steps.handoff.outputs.deployment }}\`"
            echo "- Handoff version: \`${{ steps.handoff.outputs.version }}\`"
            echo "- Public smoke: passed"
            echo "- Disposable public v1/v2 lifecycles: passed"
            echo "- Release remains immutable prerelease; stable promotion intentionally not performed"
            echo "- Remaining release gate: authenticated codex-native-windows-v3 acceptance and human evidence review"
          } >> "${GITHUB_STEP_SUMMARY}"
