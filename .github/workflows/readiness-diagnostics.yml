name: readiness-diagnostics

on:
  push:
    branches: [release/public-readiness-20260905]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Focused runtime regressions
        run: >-
          npm test --
          packages/cli/src/worker/environment-runtime-isolation.test.ts
      - name: Show formatting corrections
        if: always()
        run: |
          npm run format >/dev/null
          git diff --exit-code
