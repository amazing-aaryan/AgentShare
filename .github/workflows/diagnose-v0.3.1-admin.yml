name: diagnose-v0.3.1-admin

on:
  push:
    branches:
      - release/v0.3.1-admin-diagnostic

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check non-secret production prerequisites
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2026-03-10"
          )

          env_status="$(curl --silent --show-error --output environment.json --write-out '%{http_code}' "${auth[@]}" "${api}/environments/production")"
          echo "PRODUCTION_ENVIRONMENT_HTTP=${env_status}"
          if [[ "${env_status}" == "200" ]]; then
            has_reviewer="$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length > 0' environment.json)"
            custom_policy="$(jq -r '.deployment_branch_policy.custom_branch_policies // false' environment.json)"
            echo "PRODUCTION_REQUIRED_REVIEWER_CONFIGURED=${has_reviewer}"
            echo "PRODUCTION_CUSTOM_BRANCH_POLICY_ENABLED=${custom_policy}"

            policies_status="$(curl --silent --show-error --output policies.json --write-out '%{http_code}' "${auth[@]}" "${api}/environments/production/deployment-branch-policies?per_page=100")"
            echo "PRODUCTION_BRANCH_POLICIES_HTTP=${policies_status}"
            if [[ "${policies_status}" == "200" ]]; then
              master_only="$(jq '[.branch_policies[]?] | length == 1 and .[0].name == "master" and .[0].type == "branch"' policies.json)"
              echo "PRODUCTION_MASTER_ONLY_POLICY=${master_only}"
            fi
          fi

          if [[ -n "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_API_TOKEN_CONFIGURED=true"
          else
            echo "CLOUDFLARE_API_TOKEN_CONFIGURED=false"
          fi
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID_CONFIGURED=true"
          else
            echo "CLOUDFLARE_ACCOUNT_ID_CONFIGURED=false"
          fi
