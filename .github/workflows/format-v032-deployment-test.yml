name: format-v032-deployment-test

on:
  push:
    branches:
      - release/deploy-v0.3.2

permissions:
  contents: read

jobs:
  show-diff:
    if: github.event.head_commit.message == 'chore: show exact Prettier diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier change
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write scripts/deployment-v032.test.mjs
          git diff -- scripts/deployment-v032.test.mjs
