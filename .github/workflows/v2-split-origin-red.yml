name: v2-split-origin-red

permissions:
  contents: read

on:
  push:
    branches:
      - feat/agentshare-v2-environments
  pull_request:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx vitest run
          packages/acb/src/environment-links.test.ts
          apps/handoff/src/index.test.ts
          packages/cli/src/commands/share-v2.test.ts
