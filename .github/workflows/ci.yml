name: ci-format-reconciliation

permissions:
  contents: write

on:
  pull_request:

jobs:
  format-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/agentshare-v2-environments
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format reconciled docs
        shell: bash
        run: |
          files=(
            .github/ISSUE_TEMPLATE/feature_request.yml
            CONTRIBUTING.md
            docs/adr/0002-product-package-identity.md
            docs/adr/0003-option-a-host-contract.md
            docs/adr/0005-open-context-transport.md
            docs/operations/local-development.md
            docs/protocol/acb-v1.md
            docs/protocol/relay-v1.md
            docs/recipient-compatibility.md
            docs/releases/README.md
            docs/ROADMAP.md
            docs/VISION.md
            packages/cli/README.md
            README.md
            SECURITY.md
          )
          npx prettier --write "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore: format reconciled docs"
          git push origin HEAD:feat/agentshare-v2-environments
