name: ci

permissions:
  contents: read

on:
  push:

jobs:
  inspect-audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compute npm audit fix
        run: npm audit fix --package-lock-only
      - name: Show proposed dependency diff
        run: git diff -- package.json package-lock.json
      - name: Reinstall proposed lockfile
        run: npm ci
      - name: Verify audit
        run: npm audit --audit-level=high
      - name: Show resolved versions
        run: npm ls vitest @vitest/coverage-v8 wrangler miniflare sharp
