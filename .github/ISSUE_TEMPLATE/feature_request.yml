name: Feature request
description: Propose a scoped AgentShare open-context transport improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        AgentShare is a free/open, account-free, capability-based transport for AI context. Before proposing a feature, please read `docs/VISION.md` and `docs/ROADMAP.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What context-handoff workflow is blocked or inefficient, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest behavior that solves the problem.
    validations:
      required: true
  - type: textarea
    id: vision
    attributes:
      label: Vision alignment
      description: |
        Explain how this preserves the account-free link flow, open interoperability, free access, explicit creator review, and blind-relay plaintext boundary. If it does not, explain why the tradeoff is necessary.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: |
        Note changes to plaintext handling, capabilities, relay trust, creator workspace access, recipient agent isolation, persistence, or model-provider exposure.
    validations:
      required: true
