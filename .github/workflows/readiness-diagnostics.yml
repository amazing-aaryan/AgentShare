name: readiness-diagnostics

on:
  push:
    branches: [release/public-readiness-20260905]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Focused runtime regressions
        run: >-
          npm test --
          packages/cli/src/worker/environment-runtime-isolation.test.ts
      - name: Show formatting corrections
        if: always()
        run: |
          npm run format >/dev/null
          git diff --exit-code
      - name: Prepare offline workbench
        if: always()
        run: >-
          tar --exclude=.git --exclude=coverage
          -czf /tmp/agentshare-workbench.tar.gz .
      - name: Retain offline workbench
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agentshare-workbench
          path: /tmp/agentshare-workbench.tar.gz
          retention-days: 1
          if-no-files-found: error
