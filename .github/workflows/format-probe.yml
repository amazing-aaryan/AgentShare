name: format-probe

permissions:
  contents: read

on:
  push:
    branches: [feat/cli-managed-updates]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          docs/adr/0004-cli-managed-updates.md
          packages/cli/src/bin.ts
          packages/cli/src/update.ts
          packages/integrations/src/integrations.test.ts
      - run: git diff --check
      - run: >-
          git diff --
          docs/adr/0004-cli-managed-updates.md
          packages/cli/src/bin.ts
          packages/cli/src/update.ts
          packages/integrations/src/integrations.test.ts
