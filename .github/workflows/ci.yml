name: ci

permissions:
  contents: write

on:
  push:

jobs:
  format-v032-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/release-v0.3.2.md
      - run: npm run format:check
      - name: Commit formatted release contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release-v0.3.2.md
          git commit -m "style: format v0.3.2 release contract"
          git push origin HEAD:release/v0.3.2-candidate
