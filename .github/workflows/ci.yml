name: ci-v2-lint-reconciliation

permissions:
  contents: write

on:
  pull_request:

jobs:
  fix-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/agentshare-v2-environments
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/tmp-fix-v2-lint.mjs
      - run: npx prettier --write apps/edge-relay/src/environment-object.ts apps/edge-relay/src/environment-object.test.ts apps/edge-relay/src/environment-quota.test.ts
      - run: npm run lint
      - name: Commit validated lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/edge-relay/src/environment-object.ts apps/edge-relay/src/environment-object.test.ts apps/edge-relay/src/environment-quota.test.ts
          git commit -m "fix: use typed web byte helpers in environment relay"
          git push origin HEAD:feat/agentshare-v2-environments
