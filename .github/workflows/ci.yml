name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Produce exact Prettier output for reconciliation
        run: |
          files=(
            .github/ISSUE_TEMPLATE/feature_request.yml
            CONTRIBUTING.md
            docs/adr/0002-product-package-identity.md
            docs/adr/0003-option-a-host-contract.md
            docs/adr/0005-open-context-transport.md
            docs/operations/local-development.md
            docs/protocol/acb-v1.md
            docs/protocol/relay-v1.md
            docs/recipient-compatibility.md
            docs/releases/README.md
            docs/ROADMAP.md
            docs/VISION.md
            packages/cli/README.md
            README.md
            SECURITY.md
          )
          npx prettier --write "${files[@]}"
          node - "${files[@]}" <<'NODE'
          const fs = require("node:fs");
          for (const file of process.argv.slice(2)) {
            const encoded = Buffer.from(fs.readFileSync(file)).toString("base64");
            console.log(`FORMATTED:${file}:${encoded}`);
          }
          NODE
          exit 1
