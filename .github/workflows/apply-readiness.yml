name: apply-reviewed-readiness-tree

on:
  push:
    branches: [release/public-readiness-20260905]
    paths:
      - .github/readiness-transfer/**
      - .github/workflows/apply-readiness.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify and materialize the tested tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          base = "2be23c8baae57e60a554d032734e243ba5829966"
          target = "88fc5ec1fba1b5e3e47d128893cb4d2a9e0c4fc6"
          expected_patch = "b635c9d537529b7a63d112e7bc550e7209286a408ff54dad2e0ba00bf5f3a5e9"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          parts = sorted(root.glob(".github/readiness-transfer/*.b64"))
          assert len(parts) == 15, "Unexpected transfer inventory"
          encoded = "".join(p.read_text().strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == expected_patch, "Patch hash mismatch"
          patch_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "readiness.patch"
          patch_path.write_bytes(patch)
          parent = git("rev-parse", "HEAD")
          git("rm", "-r", ".github/readiness-transfer", ".github/workflows/apply-readiness.yml")
          assert git("write-tree") == base, "Unexpected base tree; refusing to overwrite changes"
          git("apply", "--index", str(patch_path))
          git("diff", "--cached", "--check")
          assert git("write-tree") == target, "Tested tree mismatch"
          api = "https://api.github.com/repos/amazing-aaryan/AgentShare/git/"
          def post(endpoint, payload):
              req = urllib.request.Request(api + endpoint,
                  data=json.dumps(payload).encode(), method="POST", headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2026-03-10"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          entries = []
          for line in git("diff", "--cached", "--name-status", base).splitlines():
              status, path = line.split("\t", 1)
              assert status in {"A", "M", "D"}, "Unexpected change type"
              if status == "D":
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue
              mode, blob, _ = git("ls-files", "-s", "--", path).split(maxsplit=2)
              content = base64.b64encode((root / path).read_bytes()).decode()
              uploaded = post("blobs", {"encoding": "base64", "content": content})
              assert uploaded["sha"] == blob, "Uploaded blob mismatch"
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob})
          tree = post("trees", {"base_tree": base, "tree": entries})
          assert tree["sha"] == target, "Remote tree mismatch"
          commit = post("commits", {"message": "fix: harden public readiness and verified deployment gates",
              "tree": target, "parents": [parent]})
          print("VERIFIED_TREE=" + target)
          print("READY_COMMIT_SHA=" + commit["sha"])
          print("No branch ref, release, or deployment was changed by this workflow.")
          PY
