name: ci

permissions:
  contents: write

on:
  push:

jobs:
  bump-v032-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bump CLI workspace version
        run: npm version 0.3.2 --workspace agentshare --no-git-tag-version
      - name: Verify package identity
        shell: bash
        run: |
          test "$(node -p "require('./packages/cli/package.json').version")" = "0.3.2"
          npm ci
          npm run build
          test "$(node packages/cli/dist/bin.js --version)" = "0.3.2"
      - name: Commit generated package version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json package-lock.json
          git commit -m "chore: bump AgentShare CLI to v0.3.2"
          git push origin HEAD:release/v0.3.2-candidate
