name: production-handoff-diagnostic

permissions:
  contents: read

on:
  pull_request:

jobs:
  live-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run packages/cli/src/public-handoff.e2e.test.ts --reporter=verbose
        env:
          AGENTSHARE_E2E_RELAY: https://agentshare-relay.carnation-vermicelli.workers.dev
          AGENTSHARE_E2E_HANDOFF: https://agentshare-handoff.carnation-vermicelli.workers.dev
