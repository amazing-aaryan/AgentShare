name: format-windows-codex-isolation

permissions:
  contents: write

on:
  push:
    branches:
      - fix/windows-codex-recipient-isolation

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/windows-codex-recipient-isolation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only the isolation module
        run: |
          npx prettier --write packages/cli/src/worker/windows-codex-isolation.ts
          rm .github/workflows/format-windows-codex-isolation.yml
      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/src/worker/windows-codex-isolation.ts .github/workflows/format-windows-codex-isolation.yml
          git commit -m "style: format Windows Codex isolation module"
          git push origin HEAD:fix/windows-codex-recipient-isolation
