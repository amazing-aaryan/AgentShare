name: deploy-v0.3.1-final

on:
  push:
    branches:
      - master

permissions:
  contents: read
  actions: read

concurrency:
  group: agentshare-v0.3.1-production-final
  cancel-in-progress: false

jobs:
  deploy-and-live-gate:
    if: >-
      github.repository == 'amazing-aaryan/AgentShare' &&
      startsWith(github.event.head_commit.message, 'Merge v0.3.1 production
      deployment gate')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CANDIDATE_SHA: 5ed0c26ed90426906382d534a2b95a964b14a504
      PACKAGE_SHA256: ae82ace5ccf0511f75fb878a1f984804fa3998927829a63b4e63d9f68afb35d0
      PACKAGE_SIZE_BYTES: "156264"
      RECOVERED_HANDOFF_VERSION_ID: fee92509-418f-4ccc-a1a8-a63290b006d2
      AGENTSHARE_E2E_RELAY: https://agentshare-relay.carnation-vermicelli.workers.dev
      AGENTSHARE_E2E_HANDOFF: https://agentshare-handoff.carnation-vermicelli.workers.dev
      AGENTSHARE_NO_UPDATE_CHECK: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact immutable package source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Re-run release and deployment checks before any write
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/check-repository-hygiene.mjs
          npm run format:check
          npm run lint
          npm run build
          npm run test:release-tools
          npm run test:coverage
          npm run test:conformance
          npm run test:package
          npm run test:edge-runtime
          npx wrangler deploy --dry-run --config apps/edge-relay/wrangler.jsonc
          npx wrangler deploy --dry-run --config apps/handoff/wrangler.jsonc
          npm audit --audit-level=high

      - name: Check out reviewed release control separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Build reviewed release control
        shell: bash
        run: |
          set -euo pipefail
          cd .release-control
          npm ci
          npm run build

      - name:
          Verify exact candidate CI, production binding, and immutable package
        env:
          AGENTSHARE_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
          AGENTSHARE_PACKAGE_SHA256: ${{ env.PACKAGE_SHA256 }}
          AGENTSHARE_PACKAGE_SIZE: ${{ env.PACKAGE_SIZE_BYTES }}
        run: node .release-control/scripts/check-deployment.mjs preflight

      - name: Require Cloudflare credentials before any Worker write
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::Missing Cloudflare account ID"; exit 1; }

      - name: Record unchanged relay deployment before handoff update
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config apps/edge-relay/wrangler.jsonc --json > relay-deployments-before.json
          echo "--- unchanged relay deployments ---"
          cat relay-deployments-before.json

      - name: Verify or deploy exact handoff Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deployments list --config apps/handoff/wrangler.jsonc --json > handoff-deployments-current.json
          current_version="$(jq -r '.[-1].versions | map(select(.percentage == 100)) | if length == 1 then .[0].version_id else empty end' handoff-deployments-current.json)"
          test -n "${current_version}" || { echo "::error::Unable to resolve current handoff version"; exit 1; }

          skipped_duplicate=false
          if [[ "${current_version}" == "${RECOVERED_HANDOFF_VERSION_ID}" ]]; then
            echo "Verified prior exact-candidate handoff deployment ${RECOVERED_HANDOFF_VERSION_ID}; skipping duplicate upload."
            skipped_duplicate=true
          else
            echo "Current handoff version ${current_version} is not the recovered candidate version; deploying exact candidate."
            npx wrangler deploy --config apps/handoff/wrangler.jsonc
          fi

          npx wrangler deployments list --config apps/handoff/wrangler.jsonc --json > handoff-deployments-after.json
          current_after="$(jq -r '.[-1].versions | map(select(.percentage == 100)) | if length == 1 then .[0].version_id else empty end' handoff-deployments-after.json)"
          deployment_after="$(jq -r '.[-1].id // empty' handoff-deployments-after.json)"
          test -n "${current_after}" || { echo "::error::Unable to resolve post-check handoff version"; exit 1; }
          test -n "${deployment_after}" || { echo "::error::Unable to resolve post-check handoff deployment"; exit 1; }
          if [[ "${skipped_duplicate}" == "true" ]]; then
            test "${current_after}" = "${RECOVERED_HANDOFF_VERSION_ID}" || { echo "::error::Handoff version changed during recovery verification"; exit 1; }
          fi
          echo "HANDOFF_DEPLOYMENT_ID=${deployment_after}"
          echo "HANDOFF_VERSION_ID=${current_after}"
          echo "--- handoff deployments after verification ---"
          cat handoff-deployments-after.json

      - name: Verify public handoff, bootstrap pin, and relay routing
        run: node scripts/check-deployment.mjs smoke

      - name: Run disposable public v1 and v2 lifecycles
        run: >-
          npx vitest run packages/cli/src/public-handoff.e2e.test.ts
          packages/cli/src/environment/public-environment.e2e.test.ts
          --reporter=verbose

      - name: Re-verify immutable prerelease after live tests
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh release view v0.3.1 --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isImmutable,isPrerelease,targetCommitish,assets)"
          test "$(jq -r '.tagName' <<<"${metadata}")" = "v0.3.1"
          test "$(jq -r '.isDraft' <<<"${metadata}")" = "false"
          test "$(jq -r '.isImmutable' <<<"${metadata}")" = "true"
          test "$(jq -r '.isPrerelease' <<<"${metadata}")" = "true"
          test "$(jq -r '.targetCommitish' <<<"${metadata}")" = "${CANDIDATE_SHA}"
          test "$(jq -r '.assets[] | select(.name == "agentshare-0.3.1.tgz") | .size' <<<"${metadata}")" = "${PACKAGE_SIZE_BYTES}"
          test "$(jq -r '.assets[] | select(.name == "agentshare-0.3.1.tgz") | .digest' <<<"${metadata}")" = "sha256:${PACKAGE_SHA256}"
          {
            echo "### v0.3.1 production prerequisite gate passed"
            echo "- Exact candidate: \`${CANDIDATE_SHA}\`"
            echo "- Immutable package SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Immutable package bytes: \`${PACKAGE_SIZE_BYTES}\`"
            echo "- Relay: unchanged; current deployment inventory recorded above"
            echo "- Handoff: exact candidate deployment verified; deployment inventory recorded above"
            echo "- Public smoke: passed"
            echo "- Disposable public v1/v2 lifecycles: passed"
            echo "- Release remains immutable prerelease; stable promotion intentionally not performed"
            echo "- Remaining release gate: authenticated codex-native-windows-v2 acceptance"
          } >> "${GITHUB_STEP_SUMMARY}"
