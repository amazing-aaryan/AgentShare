name: deploy-cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentshare-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/check-repository-hygiene.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run test:conformance
      - run: npm run test:package
      - run: npm run test:edge-runtime

      - name: Deploy relay
        run: npx wrangler deploy --config apps/edge-relay/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy handoff
        run: npx wrangler deploy --config apps/handoff/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
