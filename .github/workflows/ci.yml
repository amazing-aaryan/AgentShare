name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-repository-hygiene.mjs
      - name: Print v0.2 evidence formatter diff
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npx prettier --write docs/releases/v0.2.0-release-verification.md
          git diff -- docs/releases/v0.2.0-release-verification.md
          exit 1
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run test:conformance
      - run: npm run test:package
      - run: npm run test:edge-runtime
      - run:
          npx wrangler deploy --dry-run --config apps/edge-relay/wrangler.jsonc
      - run: npx wrangler deploy --dry-run --config apps/handoff/wrangler.jsonc
      - run: npm audit --audit-level=high
