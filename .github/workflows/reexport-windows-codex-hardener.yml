name: reexport-windows-codex-hardener

permissions:
  contents: write

on:
  push:
    branches:
      - fix/windows-codex-recipient-isolation

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/windows-codex-recipient-isolation
      - name: Re-export pure hardener
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/cli/src/worker/environment-launcher.ts';
          let text = fs.readFileSync(path, 'utf8');
          const needle = `import { ensurePrivateDirectory } from "../environment/private-store.js";\n`;
          const replacement = `${needle}export { hardenCodexModelsCache } from "./windows-codex-isolation.js";\n`;
          if (!text.includes(needle)) throw new Error('expected environment launcher import anchor not found');
          text = text.replace(needle, replacement);
          fs.writeFileSync(path, text);
          NODE
          rm .github/workflows/reexport-windows-codex-hardener.yml
      - name: Commit and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/src/worker/environment-launcher.ts .github/workflows/reexport-windows-codex-hardener.yml
          git commit -m "refactor: expose Windows Codex catalog hardener"
          git push origin HEAD:fix/windows-codex-recipient-isolation
