name: ci

permissions:
  contents: write

on:
  push:

jobs:
  apply-v032-profile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add frozen v0.3.2 Windows profile
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "scripts/release-evidence.mjs";
          let source = readFileSync(path, "utf8");
          const profileMarker = "const PROFILES = new Map([";
          if (!source.includes("export const FORWARD_NATIVE_WINDOWS_PROFILE")) {
            const addition = `export const FORWARD_NATIVE_WINDOWS_PROFILE =\n  "codex-native-windows-v3";\nexport const FORWARD_NATIVE_WINDOWS_RUNTIME = Object.freeze({\n  ...RUNTIME,\n  agentVersion: "0.153.4",\n});\nexport const FORWARD_NATIVE_WINDOWS_OBSERVATIONS = Object.freeze({\n  ...NATIVE_OBSERVATIONS,\n  bootstrap: Object.freeze({\n    ...NATIVE_OBSERVATIONS.bootstrap,\n    installedVersion: "0.3.2",\n  }),\n  isolation: Object.freeze({\n    ...NATIVE_OBSERVATIONS.isolation,\n    canonicalModelMetadataUnmodified: true,\n    modelMetadataCompatibilityVerified: true,\n  }),\n});\n`;
            if (!source.includes(profileMarker)) throw new Error("profile marker missing");
            source = source.replace(profileMarker, `${addition}${profileMarker}`);
          }
          const mapMarker = "]);\nfunction releaseProfile(name)";
          if (!source.includes("version: \"0.3.2\"")) {
            const entry = `  [\n    FORWARD_NATIVE_WINDOWS_PROFILE,\n    Object.freeze({\n      version: "0.3.2",\n      runtime: FORWARD_NATIVE_WINDOWS_RUNTIME,\n      observations: FORWARD_NATIVE_WINDOWS_OBSERVATIONS,\n    }),\n  ],\n`;
            if (!source.includes(mapMarker)) throw new Error("profile map marker missing");
            source = source.replace(mapMarker, `${entry}${mapMarker}`);
          }
          writeFileSync(path, source);
          NODE
          npx prettier --write scripts/release-evidence.mjs
      - run: npm run test:release-tools
      - name: Commit profile implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release-evidence.mjs
          git commit -m "feat: add v0.3.2 Windows acceptance profile"
          git push origin HEAD:release/v0.3.2-candidate
