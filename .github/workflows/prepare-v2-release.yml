name: prepare-v2-release

permissions:
  contents: write

on:
  push:
    branches:
      - feat/agentshare-v2-environments

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/agentshare-v2-environments
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set CLI release version
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'packages/cli/package.json';
          const pkg = JSON.parse(await readFile(path, 'utf8'));
          pkg.version = '0.2.0';
          await writeFile(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - run: npm run format
      - name: Commit release preparation
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare AgentShare v0.2.0"
          git push origin HEAD:feat/agentshare-v2-environments
