name: release-docs-v0.2.1

on:
  push:
    branches:
      - release/v0.2.1-candidate

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.2.1-candidate
      - name: Update release policy documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          old_note = '''> [!NOTE] This repository contains the v0.2 collaborative-environment candidate.
          > It is not a stable public v0.2.0 release until the immutable package, live
          > Cloudflare deployment, and authenticated Codex/Claude release gates in the
          > [deployment runbook](docs/operations/cloudflare-deployment.md) pass. Until
          > then, use the current stable GitHub release for production installation.'''
          new_note = '''> [!NOTE] This repository contains the v0.2 collaborative-environment line. The
          > current patch release candidate is v0.2.1, which ships the Codex
          > minimum-version plus runtime-capability compatibility policy. Stable
          > publication still requires immutable package staging, live split-origin
          > verification, and fresh evidence for every recipient security surface changed
          > by the release. See the
          > [deployment runbook](docs/operations/cloudflare-deployment.md). Until
          > promotion, use the current stable GitHub release for production installation.'''
          if old_note not in text:
              raise SystemExit("README release note anchor not found")
          text = text.replace(old_note, new_note)

          old_gate = '''CI runs the same core gate across Ubuntu, macOS, and Windows on Node.js 22
          and 24. A stable public release additionally requires live split-origin
          deployment verification and authenticated real Codex/Claude recipient-isolation
          tests:

          ```powershell
          $env:AGENTSHARE_E2E_RELAY="https://agentshare-relay.carnation-vermicelli.workers.dev"
          $env:AGENTSHARE_E2E_HANDOFF="https://agentshare-handoff.carnation-vermicelli.workers.dev"
          npm run test:release
          ```

          A new agent adapter is not considered supported merely because it can receive a
          prompt. It must prove creator extraction, capability handling, and recipient
          isolation on exact reviewed releases.'''
          new_gate = '''CI runs the same core gate across Ubuntu, macOS, and Windows on Node.js 22
          and 24. A stable public release additionally requires live split-origin
          deployment verification and fresh recipient compatibility/isolation evidence for
          every agent, launcher, or sandbox surface changed by that release. On a patch
          release, an unchanged adapter may carry forward its most recent recorded real-host
          isolation evidence, but the release record must identify the carried-forward
          surface explicitly.

          `npm run test:release` remains the strongest full two-agent diagnostic when both
          authenticated hosts are available:

          ```powershell
          $env:AGENTSHARE_E2E_RELAY="https://agentshare-relay.carnation-vermicelli.workers.dev"
          $env:AGENTSHARE_E2E_HANDOFF="https://agentshare-handoff.carnation-vermicelli.workers.dev"
          npm run test:release
          ```

          A new agent adapter is not considered supported merely because it can receive a
          prompt. It must prove creator extraction, capability handling, and real recipient
          isolation before public support is claimed. Codex additionally fails closed on
          versions below its minimum or when required runtime isolation controls disappear.'''
          if old_gate not in text:
              raise SystemExit("README release gate anchor not found")
          readme.write_text(text.replace(old_gate, new_gate))

          runbook = Path("docs/operations/cloudflare-deployment.md")
          text = runbook.read_text()
          text = text.replace(
              "The v0.2.0 candidate uses two public Workers with different responsibilities:",
              "The official deployment uses two public Workers with different responsibilities:",
          )
          old_pin = '''The v0.2.0 handoff Worker pins the immutable `agentshare-0.2.0.tgz`
          GitHub-release asset. Stage that exact asset before the handoff deployment so
          the browser command cannot point at a missing package. Keep the GitHub release
          marked as a prerelease until the strict live gate passes; the AgentShare updater
          ignores prereleases.'''
          new_pin = '''The handoff Worker for a release must pin that release's exact immutable
          `agentshare-<version>.tgz` GitHub asset. Stage the exact asset before deploying a
          handoff change so the browser bootstrap cannot point at a missing package. Keep
          the GitHub release marked as a prerelease until the applicable live release
          evidence passes; the AgentShare updater ignores prereleases.'''
          if old_pin not in text:
              raise SystemExit("runbook package pin anchor not found")
          text = text.replace(old_pin, new_pin)

          old_order = '''Authenticate Wrangler, then deploy the relay with the complete published Durable
          Object migration history intact:

          ```powershell
          npx wrangler login
          npx wrangler deploy --config apps/edge-relay/wrangler.jsonc
          ```'''
          new_order = '''Deploy only the production services changed by the release. If relay code,
          bindings, or storage behavior changed, authenticate Wrangler and deploy the relay
          with the complete published Durable Object migration history intact:

          ```powershell
          npx wrangler login
          npx wrangler deploy --config apps/edge-relay/wrangler.jsonc
          ```

          A handoff/package-only patch does not require a relay redeploy. Leaving an
          unchanged relay in place avoids unnecessary Durable Object deployment risk.'''
          if old_order not in text:
              raise SystemExit("runbook deployment order anchor not found")
          text = text.replace(old_order, new_order)
          text = text.replace(
              "Next deploy the independent handoff Worker:",
              "Deploy the independent handoff Worker whenever its page or bootstrap pin changed:",
          )
          text = text.replace(
              "  expected v0.2 bootstrap document.",
              "  exact bootstrap document for the staged release.",
          )

          start = text.index("## Strict Live Release Gate")
          end = text.index("## Rollback")
          live = '''## Live Release Evidence

          After the staged immutable package and all changed Workers are live, verify the
          exact release candidate against the public origins. The release gate fails unless
          relay and handoff are distinct HTTPS origins. Every release must exercise the real
          handoff surfaces, security headers, relay lifecycle semantics, bootstrap pin, and
          disposable v1/v2 flows.

          Recipient isolation evidence follows the surface changed by the release:

          - a new agent adapter or a change to launcher/sandbox authority requires fresh
            real-host filesystem/network isolation evidence before stable promotion;
          - a compatibility-preflight-only patch must freshly verify the changed preflight
            against the current published host and prove the restrictive launcher profile
            itself did not change;
          - an unchanged adapter on a patch release may carry forward its most recent
            recorded real-host isolation evidence, and the release record must say so
            explicitly.

          When authenticated reviewed Codex and Claude installations are both available,
          the repository's full two-agent diagnostic remains:

          ```powershell
          $env:AGENTSHARE_E2E_RELAY="https://agentshare-relay.carnation-vermicelli.workers.dev"
          $env:AGENTSHARE_E2E_HANDOFF="https://agentshare-handoff.carnation-vermicelli.workers.dev"
          npm run test:release
          ```

          `npm run test:release` intentionally still requires both agents. A patch release
          that carries forward an unchanged adapter must not claim that this full diagnostic
          passed; its release record instead identifies the exact fresh and carried-forward
          evidence.

          AgentShare's agent-agnostic direction does not weaken the fail-closed boundary.
          Each newly supported target still requires equivalent real isolation review.

          ## Promote the Release

          Only after the applicable live evidence succeeds should the staged GitHub release
          be promoted from prerelease to stable. Promotion changes release metadata only; it
          must not replace the verified tarball. Re-download the asset, verify its recorded
          byte size and SHA-256, and perform a fresh isolated installation from the same
          immutable bytes.

          The handoff page/bootstrap must still pin that exact asset. Verify one disposable
          v1 share and one disposable v2 environment through the real public origins before
          announcing the stable release.

          Record the exact commit, package digest, changed Worker deployment identifiers,
          fresh recipient evidence, and any explicitly carried-forward adapter evidence
          under `docs/releases/`.

          '''
          text = text[:start] + live + text[end:]
          text = text.replace(
              "If a defect appears before v0.2.0 is promoted to stable, keep the release marked\nas a prerelease, roll back the affected Worker code, and leave the current\nstable package as the recommended version.",
              "If a defect appears before a candidate is promoted to stable, keep the release\nmarked as a prerelease, roll back the affected Worker code, and leave the current\nstable package as the recommended version.",
          )
          runbook.write_text(text)
          PY
      - name: Commit release documentation
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/operations/cloudflare-deployment.md; then
            echo "No documentation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/operations/cloudflare-deployment.md
          git commit -m "docs: define patch release evidence policy"
          git push origin HEAD:release/v0.2.1-candidate
