name: format-v0.3.1-production-gate

on:
  push:
    branches:
      - release/v0.3.1-production-gate

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write .github/workflows/deploy-v0.3.1-final.yml
      - run: cat .github/workflows/deploy-v0.3.1-final.yml
