name: ci-contract-coverage-reconciliation

permissions:
  contents: write

on:
  pull_request:

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/agentshare-v2-environments
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write packages/contracts/src/environment-machine.test.ts packages/contracts/src/proposals.test.ts
      - run: npm run lint
      - run: npm run test:coverage
      - name: Commit verified formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packages/contracts/src/environment-machine.test.ts packages/contracts/src/proposals.test.ts
          git commit -m "test: format v2 contract coverage cases"
          git push origin HEAD:feat/agentshare-v2-environments
