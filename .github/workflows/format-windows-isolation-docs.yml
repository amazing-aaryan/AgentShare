name: format-windows-isolation-docs

permissions:
  contents: write

on:
  push:
    branches:
      - fix/codex-v2-forward-compat

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/codex-v2-forward-compat
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/recipient-compatibility.md docs/operations/cloudflare-deployment.md
      - run: git rm .github/workflows/format-windows-isolation-docs.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recipient-compatibility.md docs/operations/cloudflare-deployment.md
          git commit -m "style: format Windows isolation docs"
          git push origin HEAD:fix/codex-v2-forward-compat
