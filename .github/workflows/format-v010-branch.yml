name: format-v010-branch

permissions:
  contents: write

on:
  push:
    branches:
      - fix/handoff-trust-and-lifecycle

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write README.md SECURITY.md
      - name: Commit formatting if changed
        shell: bash
        run: |
          if git diff --quiet -- README.md SECURITY.md; then
            echo "Files already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SECURITY.md
          git commit -m "style: format v0.1.10 release alignment"
          git push origin "HEAD:${GITHUB_REF_NAME}"
