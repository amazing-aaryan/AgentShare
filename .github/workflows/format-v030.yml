name: format-v030

on:
  push:
    branches:
      - release/v0.3.1-codex

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write packages/cli/src/launchers.test.ts README.md
      - run: |
          git rm .github/workflows/format-v030.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/src/launchers.test.ts README.md
          git commit -m "style: apply Prettier to release candidate"
          git push origin HEAD:release/v0.3.1-codex
