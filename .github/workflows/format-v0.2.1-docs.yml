name: format-v0.2.1-docs

on:
  push:
    branches:
      - release/v0.2.1-candidate

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/v0.2.1-candidate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier README.md docs/operations/cloudflare-deployment.md docs/releases/v0.2.1-release-verification.md --write
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/operations/cloudflare-deployment.md docs/releases/v0.2.1-release-verification.md; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/operations/cloudflare-deployment.md docs/releases/v0.2.1-release-verification.md
          git commit -m "style: format v0.2.1 release docs"
          git push origin HEAD:release/v0.2.1-candidate
